name: KeepAlive (clang cache + 定时保活)

# 两件事：
#   1. 维护 clang 23.0.1（clang-r614150）的缓存，避免构建时重复下载 ~2GB 工具链
#   2. 每天提交一次心跳，防止 GitHub 因仓库长期无提交而停用定时任务（60 天规则）
on:
  schedule:
    - cron: '0 3 * * *'      # 每天 03:00 UTC（北京时间 11:00）
  workflow_dispatch:

env:
  CLANG_VER: clang-r614150          # clang 23.0.1
  CLANG_BRANCH: mirror-goog-main-llvm-toolchain-source

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: 1. 检出仓库
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: 2. 恢复 Clang 缓存（复用仓库现有缓存）
      id: cache-clang
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/clang
        key: aosp-clang-linux-x86-23.0.1
        restore-keys: |
          aosp-clang-linux-x86

    - name: 3. 确保 Clang 23.0.1（缓存里不是则补齐）
      run: |
        set -e
        CLANG_BIN="$GITHUB_WORKSPACE/clang/bin/clang"
        NEED=0
        if [ -x "$CLANG_BIN" ]; then
          V="$($CLANG_BIN --version | head -1)"
          echo "cache: $V"
          echo "$V" | grep -q "23.0.1" || NEED=1
        else
          echo "cache miss"
          NEED=1
        fi
        if [ "$NEED" = "1" ]; then
          echo "下载 $CLANG_VER (23.0.1)"
          rm -rf "$GITHUB_WORKSPACE/clang"
          mkdir -p "$GITHUB_WORKSPACE/clang"
          cd "$GITHUB_WORKSPACE/clang"
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${CLANG_BRANCH}/${CLANG_VER}.tar.gz"
          curl -fL --retry 3 --retry-delay 5 "$URL" -o clang.tar.gz
          tar -xzf clang.tar.gz
          rm -f clang.tar.gz
        fi
        "$CLANG_BIN" --version | head -1

    - name: 4. 校验版本
      run: |
        set -e
        VERSION="$($GITHUB_WORKSPACE/clang/bin/clang --version | head -1)"
        echo "$VERSION"
        echo "$VERSION" | grep -q "23.0.1" || { echo "ERROR: clang 版本不是 23.0.1"; exit 1; }
        echo "CLANG_OK"

    - name: 5. 心跳提交（防空闲停用定时任务）
      run: |
        set -e
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        mkdir -p .github
        {
          echo "clang: ${CLANG_VER} (23.0.1)"
          echo "last-beat: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')"
        } > .github/keepalive.txt
        git add .github/keepalive.txt
        if git diff --cached --quiet; then
          echo "没有变化，跳过提交"
        else
          git commit -m "chore: keepalive $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          git push
        fi
