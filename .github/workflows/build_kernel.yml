name: Unified Kernel (AOSP + MIUI/HyperOS)

# 双系统统一内核：
#   - 显示适配（l11r 面板 / mdss_mdp cooling-cells / 背光克隆）已直接写进源码，不再编译时打补丁
#   - 一份 defconfig 同时满足 AOSP 与 MIUI/HyperOS
#   - clang-r614150（clang 23.0.1）固定版本，clang 与 ccache 双缓存
#   - 无 LTO（CONFIG_LTO_NONE=y），与原厂一致
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Source branch'
        required: true
        default: 'unified-aosp-miui'
        type: string
      compile_variant:
        description: 'Select Variant (DEF= with ksu)'
        required: true
        default: 'ksu'
        type: choice
        options:
          - both
          - normal
          - ksu
      ignore_warnings:
        description: 'ignore all warnings?'
        required: true
        default: true
        type: boolean

env:
  CLANG_VER: clang-r614150          # clang 23.0.1
  CLANG_BRANCH: mirror-goog-main-llvm-toolchain-source
  CCACHE_MAXSIZE: 6G

jobs:
  matrix-generator:
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.set-matrix.outputs.variants }}
    steps:
      - id: set-matrix
        run: |
          CHOICE="${{ github.event.inputs.compile_variant }}"
          if [ "$CHOICE" = "both" ]; then
            JSON='["normal", "ksu"]'
          else
            JSON='["'"$CHOICE"'"]'
          fi
          echo "variants=$JSON" >> $GITHUB_OUTPUT

  build-kernel:
    needs: matrix-generator
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.matrix-generator.outputs.variants) }}
    name: 编译内核 (${{ matrix.variant }})
    steps:
    - name: 1. 检出云端内核源码
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.inputs.branch }}
        fetch-depth: 1

    - name: 2. 初始化编译环境
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
          gcc-multilib git gnupg gperf libelf-dev libssl-dev lzop rsync schedtool \
          squashfs-tools xsltproc zip zlib1g-dev

    - name: 3. 恢复 Clang 缓存
      id: cache-clang
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/clang
        key: ${{ env.CLANG_VER }}-linux-x86

    - name: 4. 下载 Clang 23.0.1（缓存未命中时）
      if: steps.cache-clang.outputs.cache-hit != 'true'
      run: |
        set -e
        mkdir -p "$GITHUB_WORKSPACE/clang"
        cd "$GITHUB_WORKSPACE/clang"
        URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${CLANG_BRANCH}/${CLANG_VER}.tar.gz"
        echo "downloading $CLANG_VER"
        curl -fL --retry 3 --retry-delay 5 "$URL" -o clang.tar.gz
        tar -xzf clang.tar.gz
        rm -f clang.tar.gz
        ./bin/clang --version | head -1

    - name: 5. 校验 Clang 版本
      run: |
        set -e
        VERSION="$($GITHUB_WORKSPACE/clang/bin/clang --version | head -1)"
        echo "$VERSION"
        echo "$VERSION" | grep -q "23.0.1" || { echo "ERROR: clang 版本不是 23.0.1"; exit 1; }
        echo "CLANG_OK"

    - name: 6. 恢复 ccache
      id: cache-ccache
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.ccache
        key: ccache-${{ matrix.variant }}-${{ hashFiles('arch/arm64/configs/vendor/munch_defconfig', 'arch/arm64/configs/vendor/munch.config') }}
        restore-keys: |
          ccache-${{ matrix.variant }}-

    - name: 7. 集成 ReSukiSU
      if: matrix.variant != 'normal'
      run: |
        cd $GITHUB_WORKSPACE
        curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

    - name: 8. KSU 定制
      if: matrix.variant != 'normal'
      run: |
        cd $GITHUB_WORKSPACE
        echo "开始为 ReSukiSU 赋能"
        cp legendary.c KernelSU/kernel/selinux/rules.c
        echo "赋能后检查是否赋能成功"
        cat KernelSU/kernel/selinux/rules.c | grep "feimengxinren"
        STATUS=$?
        if [ $STATUS -eq 0 ]; then
          echo "已检测到特定标志，赋能成功！"
          sed -i 's/-dirty//g' KernelSU/kernel/Kbuild
        else
          echo "未检测到特定标志，赋能失败！"
        fi

    - name: 9. 清理 KSU 配置（无 KSU 变体）
      if: matrix.variant == 'normal'
      run: |
        cd $GITHUB_WORKSPACE
        DEFCONFIG_PATH="arch/arm64/configs/vendor/kona-perf_defconfig"
        echo "移除KSU配置"
        sed -i '/CONFIG_KSU/d' $DEFCONFIG_PATH
        sed -i '/CONFIG_KSU_MANUAL_HOOK/d' $DEFCONFIG_PATH
        sed -i '/CONFIG_KSU_TOOLKIT_SUPPORT/d' $DEFCONFIG_PATH
        sed -i '/CONFIG_KSU_SUSFS/d' $DEFCONFIG_PATH
        echo "在Makefile与Kconfig中移除KSU相关代码"
        sed -i '/obj-\$(CONFIG_KSU) += kernelsu\//d' drivers/Makefile
        sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig
        echo "关闭本地源码完整性校验"
        git diff --name-only | xargs -I {} git update-index --assume-unchanged "{}"

    - name: 10. 配置环境 & 编译（无 LTO）
      run: |
        set -e
        cd $GITHUB_WORKSPACE

        export KBUILD_BUILD_USER="kleaf"
        export KBUILD_BUILD_HOST="build-host"
        export KBUILD_BUILD_TIMESTAMP="$(TZ="Asia/Shanghai" date +"%a %b %d %H:%M:%S CST %Y")"

        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export LLVM=1
        export LLVM_IAS=1
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-

        # ccache：跨 run 复用编译结果
        export CCACHE_DIR=$GITHUB_WORKSPACE/.ccache
        export CCACHE_BASEDIR=$GITHUB_WORKSPACE
        export CCACHE_MAXSIZE=${{ env.CCACHE_MAXSIZE }}
        export CCACHE_COMPILERCHECK=content
        export CCACHE_SLOPPINESS=time_macros,include_file_ctime,include_file_mtime,file_stat_matches
        export CC="ccache clang --target=aarch64-linux-gnu"
        ccache --zero-stats || true

        if [ "${{ github.event.inputs.ignore_warnings }}" = "true" ]; then
          export KCFLAGS="-w"
        else
          export KCFLAGS=""
        fi

        make O=out vendor/munch_defconfig vendor/munch.config

        echo "===== 配置校验 ====="
        grep -E "LSE_ATOMICS|AS_LSE" out/.config
        grep -q "CONFIG_ARM64_LSE_ATOMICS=y" out/.config || { echo "ERROR: LSE_ATOMICS failed!"; exit 1; }

        # 无 LTO：与原厂、lineage 基线一致
        grep -q "CONFIG_LTO_NONE=y" out/.config || { echo "ERROR: CONFIG_LTO_NONE 未生效"; exit 1; }
        if grep -q "^CONFIG_LTO_CLANG=y" out/.config; then echo "ERROR: LTO_CLANG 被打开了"; exit 1; fi
        if grep -q "^CONFIG_THINLTO=y" out/.config; then echo "ERROR: THINLTO 被打开了"; exit 1; fi
        echo "NO_LTO_OK"

        # 双系统必需：模块版本校验（vendor 分区 .ko 的 vermagic 带 modversions）
        grep -q "CONFIG_MODVERSIONS=y" out/.config || { echo "ERROR: MODVERSIONS 未开，vendor .ko 会加载失败"; exit 1; }
        echo "MODVERSIONS_OK"

        make O=out -j$(nproc --all) Image.gz

        # dtb 单独编；失败不阻塞主产物
        make O=out -j$(nproc --all) vendor/qcom/kona-v2.1.dtb || \
          make O=out -j$(nproc --all) dtbs || true

    - name: 11. 打包产物
      run: |
        set -e
        cd $GITHUB_WORKSPACE
        mkdir -p release
        cp out/arch/arm64/boot/Image.gz release/Image.gz

        DTB=$(find out/arch/arm64/boot/dts -name 'kona-v2.1.dtb' | head -1 || true)
        if [ -n "$DTB" ]; then
          cp "$DTB" release/dtb
          echo "dtb: $DTB"
        else
          echo "WARN: 没编出 kona-v2.1.dtb，zip 只含 Image.gz"
        fi

        NAME="${{ matrix.variant }}_unified-aosp-miui_munch_$(TZ=Asia/Shanghai date +%Y%m%d_%H%M)_$(git rev-parse --short HEAD).zip"
        cd release && zip -9 "../$NAME" * && cd ..
        ls -lh "$NAME"
        sha256sum "$NAME" | tee "$NAME.sha256"

        echo "===== Image 校验 ====="
        ls -lh release/Image.gz
        python3 - <<'PY'
        import gzip
        d = gzip.open('release/Image.gz','rb').read(64)
        print('ARM64 magic:', d[56:60])
        assert d[56:60] == b'ARM\x64', 'bad arm64 magic'
        print('IMAGE_OK')
        PY

        echo "===== ccache 统计 ====="
        export CCACHE_DIR=$GITHUB_WORKSPACE/.ccache
        ccache --show-stats || true

    - name: 12. 上传产物
      uses: actions/upload-artifact@v6
      with:
        name: Munch-Unified-${{ matrix.variant }}
        path: |
          ${{ github.workspace }}/release/Image.gz
          ${{ github.workspace }}/*.zip
          ${{ github.workspace }}/*.zip.sha256
        if-no-files-found: error
