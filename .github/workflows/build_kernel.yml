name: Lawlessness

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Source branch'
        required: true
        default: 'miui'
        type: string
      compile_variant:
        description: 'Select Variant (DEF= with ksu)'
        required: true
        default: 'ksu'
        type: choice
        options:
          - both
          - normal
          - ksu
      ignore_warnings:
        description: 'ignore all warnings?'
        required: true
        default: true
        type: boolean
jobs:
  matrix-generator:
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.set-matrix.outputs.variants }}
    steps:
      - id: set-matrix
        run: |
          CHOICE="${{ github.event.inputs.compile_variant }}"
          if [ "$CHOICE" = "both" ]; then
            JSON='["normal", "ksu"]'
          else
            JSON='["'"$CHOICE"'"]'
          fi
          echo "variants=$JSON" >> $GITHUB_OUTPUT
  build-kernel:
    needs: matrix-generator
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.matrix-generator.outputs.variants) }}
    name: 编译内核 (${{ matrix.variant }})
    steps:
    - name: 1. 检出云端内核源码
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.inputs.branch }}
    - name: 2. 初始化编译环境
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libelf-dev libssl-dev lzop rsync schedtool squashfs-tools xsltproc zip zlib1g-dev    
    - name: 3. 检查/恢复 Clang 缓存
      id: cache-clang
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/clang
        key: aosp-clang-linux-x86  
    - name: 4. 集成RE-SUKISU
      if: matrix.variant != 'normal'
      run: |
        cd $GITHUB_WORKSPACE
        curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
    - name: 5. 秘术：超神魔改赋能
      if: matrix.variant != 'normal'
      run: |
        cd $GITHUB_WORKSPACE
        echo "开始为RE-SUKISU赋能"
        cp legendary.c KernelSU/kernel/selinux/rules.c
        echo "赋能后检查是否赋能成功"
        cat KernelSU/kernel/selinux/rules.c | grep "feimengxinren"
        STATUS=$?
        if [ $STATUS -eq 0 ]; then
          echo "已检测到特定标志，赋能成功！"
          sed -i 's/-dirty//g' KernelSU/kernel/Kbuild
        else
          echo "未检测到特定标志，赋能失败！"
        fi   
    - name: 6. 打上若干补丁 + 移除 KSU 配置
      if: matrix.variant == 'normal'
      run: |
        cd $GITHUB_WORKSPACE
        DEFCONFIG_PATH="arch/arm64/configs/vendor/kona-perf_defconfig"
        echo "移除KSU配置"
        sed -i '/CONFIG_KSU/d' $DEFCONFIG_PATH
        sed -i '/CONFIG_KSU_MANUAL_HOOK/d' $DEFCONFIG_PATH
        sed -i '/CONFIG_KSU_TOOLKIT_SUPPORT/d' $DEFCONFIG_PATH
        sed -i '/CONFIG_KSU_SUSFS/d' $DEFCONFIG_PATH
        echo "在Makefile与Kconfig中移除KSU相关代码"
        sed -i '/obj-\$(CONFIG_KSU) += kernelsu\//d' drivers/Makefile
        sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig
        echo "关闭本地源码完整性校验"
        git diff --name-only | xargs -I {} git update-index --assume-unchanged "{}"   
    - name: 7. MIUI 适配（编译时打补丁，可重复执行）
      run: |
        cd $GITHUB_WORKSPACE
        set -e
        DTS=arch/arm64/boot/dts/vendor/qcom/munch-sm8250.dtsi
        PANEL=arch/arm64/boot/dts/vendor/qcom/dsi-panel-l11r-38-08-0a-dsc-cmd.dtsi
        CONN=techpack/display/msm/sde/sde_connector.c

        echo "===== [1/3] mdss_mdp 补 #cooling-cells（背光克隆热器件父节点要求）====="
        if grep -q 'MIUI-DISPLAY-FIX: mdss_mdp #cooling-cells' "$DTS"; then
          echo "已打过，跳过"
        else
          grep -q '^&mdss_mdp {' "$DTS" || { echo "ERROR: 找不到 &mdss_mdp 节点"; exit 1; }
          cat >> "$DTS" <<'EOF'

        /*
         * MIUI-DISPLAY-FIX: mdss_mdp #cooling-cells
         *
         * sde_backlight_setup() 注册完 panel0-backlight 后会注册亮度克隆热器件，
         * 而该热器件要求父节点(mdss_mdp)带 "#cooling-cells"，缺了直接 -ENODEV，
         * 于是刚注册好的背光设备被注销，/sys/class/backlight 下空掉，
         * MIUI 亮度服务无处可写 → 有画面、有触控，但没有背光（全黑）。
         * 原厂 dtbo 的 fragment@69 补的就是这个属性。
         */
        &mdss_mdp {
        	#cooling-cells = <0>;
        };
        EOF
          echo "已补 &mdss_mdp #cooling-cells"
        fi

        echo "===== [2/3] l11r 面板补 mi,panel-id / mi,mdss-dsi-panel-dc-type ====="
        if grep -q 'mi,panel-id = "L11R"' "$PANEL"; then
          echo "已打过，跳过"
        else
          grep -q '^&dsi_l11r_38_08_0a_dsc_cmd {' "$PANEL" || { echo "ERROR: 找不到 l11r 面板节点"; exit 1; }
          grep -q 'mi,mdss-dsi-panel-dc-threshold = <440>;' "$PANEL" || { echo "ERROR: 找不到 dc-threshold 锚点"; exit 1; }
          sed -i '/^&dsi_l11r_38_08_0a_dsc_cmd {$/a\	mi,panel-id = "L11R", "8\\b";' "$PANEL"
          sed -i 's|^\tmi,mdss-dsi-panel-dc-threshold = <440>;|\tmi,mdss-dsi-panel-dc-type = <0>;\n&|' "$PANEL"
          echo "已补 panel-id / dc-type"
        fi

        echo "===== [3/3] 背光克隆热器件注册失败不再注销真正的背光设备 ====="
        if grep -q 'keep backlight alive' "$CONN"; then
          echo "已打过，跳过"
        else
          grep -q 'backlight_device_unregister(c_conn->bl_device);' "$CONN" || { echo "ERROR: 找不到背光注销逻辑"; exit 1; }
          python3 - "$CONN" <<'PY'
        import sys
        p = sys.argv[1]
        s = open(p, encoding='utf-8').read()
        old = '''	rc = sde_backlight_clone_setup(c_conn, dev->dev, c_conn->bl_device);
        	if (rc) {
        		SDE_ERROR("Failed to register backlight_clone_cdev: %ld\\n",
        				    PTR_ERR(c_conn->cdev_clone));
        		backlight_clone_cdev_unregister(c_conn->cdev_clone);
        		backlight_device_unregister(c_conn->bl_device);
        		c_conn->bl_device = NULL;
        		return -ENODEV;
        	}
        '''
        new = '''	rc = sde_backlight_clone_setup(c_conn, dev->dev, c_conn->bl_device);
        	if (rc) {
        		/*
        		 * 亮度克隆热器件只用于 display cooling，注册不上不应该连累
        		 * 真正的背光设备：原来这里会把刚注册的 panel0-backlight 注销，
        		 * 导致 /sys/class/backlight 下空掉，MIUI 亮度服务无处可写，
        		 * 表现为系统完全正常但屏幕没有任何背光（全黑）。
        		 */
        		SDE_ERROR("Failed to register backlight_clone_cdev: %d, keep backlight alive\\n",
        				    rc);
        		c_conn->cdev_clone = NULL;
        	}
        '''
        assert s.count(old) == 1, "锚点匹配数 %d != 1" % s.count(old)
        open(p, 'w', encoding='utf-8').write(s.replace(old, new))
        PY
          echo "已改为不注销背光设备"
        fi

        echo "===== 补丁结果自检 ====="
        grep -n -A1 '^&mdss_mdp {' "$DTS" | tail -3
        grep -n 'mi,panel-id\|mi,mdss-dsi-panel-dc-type' "$PANEL"
        grep -n 'keep backlight alive' "$CONN"
        echo "MIUI_ADAPT_OK"

    - name: 8. 配置环境&开始编译
      run: |
        cd $GITHUB_WORKSPACE
        export KBUILD_BUILD_USER="kleaf"
        export KBUILD_BUILD_HOST="build-host"
        export KBUILD_BUILD_TIMESTAMP="$(TZ="Asia/Shanghai" date +"%a %b %d %H:%M:%S CST %Y")"
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CC="clang --target=aarch64-linux-gnu"
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export LLVM=1
        export LLVM_IAS=1
        if [ "${{ github.event.inputs.ignore_warnings }}" = "true" ]; then
          export KCFLAGS="-w"
        else
          export KCFLAGS=""
        fi
        make O=out vendor/munch_defconfig vendor/munch.config
        grep -E "LSE_ATOMICS|AS_LSE" out/.config
        # 确保两项都为 y，否则直接中断构建避免浪费时间
        grep -q "CONFIG_ARM64_LSE_ATOMICS=y" out/.config || { echo "ERROR: LSE_ATOMICS failed!"; exit 1; }
        make O=out -j$(nproc --all) Image.gz
    - name: 9. 上传 Image.gz
      uses: actions/upload-artifact@v6
      with:
        name: Munch-Image-${{ matrix.variant }}
        path: out/arch/arm64/boot/Image.gz
