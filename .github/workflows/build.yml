name: Lawlessness

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    strategy:
      # 设置为 false，即使其中一个编译失败，其他任务也会继续编译，不会被强行中止
      fail-fast: false
      matrix:
        # 定义三种编译变体：无KSU、默认带KSU、完全体魔改KSU
        variant: [no-ksu, with-ksu, mod-ksu]

    name: 编译内核 (${{ matrix.variant }})
    steps:
    - name: 1. 检出云端内核源码
      uses: actions/checkout@v4
      with:
        ref: lineage-23.2

    - name: 2. 初始化编译环境
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libelf-dev libssl-dev lzop rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
        
    - name: 2.5 检查/恢复 Clang 缓存
      id: cache-clang
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/clang
        key: clang-r596125-linux-x86
        
    - name: 3. 下载谷歌官方 AOSP Clang 编译器
      if: steps.cache-clang.outputs.cache-hit != 'true'
      run: |
        mkdir -p $GITHUB_WORKSPACE/clang
        cd $GITHUB_WORKSPACE/clang
        wget -nv https://googlesource.com -O clang.tar.gz
        tar -xf clang.tar.gz
        
    - name: 3.5 集成KSU (仅在需要KSU的变体中运行)
      if: matrix.variant != 'no-ksu'
      run: |
        cd $GITHUB_WORKSPACE
        curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
        
    - name: 4. 秘术：偷梁换柱-超神魔改 (仅在完全体魔改变体中运行)
      if: matrix.variant == 'mod-ksu'
      run: |
        cd $GITHUB_WORKSPACE
        echo "开始替换rules.c"
        cp legendary.c KernelSU/kernel/selinux/rules.c
        echo "替换后检测是否更改成功"
        cat KernelSU/kernel/selinux/rules.c | grep "feimengxinren"
        STATUS=$?
        if [ $STATUS -eq 0 ]; then
          echo "已检测到特定注释标志，超度成功！"
          echo "已关闭源码合法性检测以消除dirty标志"
          sed -i 's/-dirty//g' KernelSU/kernel/Kbuild
        else
          echo "未检测到特定注释标志，超度失败！"
        fi

    - name: 4.5 移除源码中的KSU配置与打上若干补丁
      if: matrix.variant == 'no-ksu'
      run: |
        cd $GITHUB_WORKSPACE
        DEFCONFIG_PATH="arch/arm64/configs/vendor/kona-perf_defconfig"
        echo "关闭KSU编译开关"
        sed -i '/CONFIG_KSU/d' $DEFCONFIG_PATH
        sed -i '/CONFIG_KSU_MANUAL_HOOK/d' $DEFCONFIG_PATH
        echo "在Makefile与Kconfig中移除KSU有关代码"
        sed -i '/obj-\$(CONFIG_KSU) += kernelsu\//d' drivers/Makefile
        sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig
        echo "尝试关掉源码完整性校验"
        git diff --name-only | xargs -I {} git update-index --assume-unchanged "{}"

    - name: 5. 配置环境&开始编译
      run: |
        cd $GITHUB_WORKSPACE
        export KBUILD_BUILD_USER="kleaf"
        export KBUILD_BUILD_HOST="build-host"
        export LOCALVERSION=""
        export LOCALVERSION_AUTO=y
        export KBUILD_BUILD_TIMESTAMP="$(TZ="Asia/Shanghai" date +"%a %b %d %H:%M:%S CST %Y")"
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export CC=clang
        export CROSS_COMPILE=aarch64-linux-gnu-
        export LLVM=1 
        export LLVM_IAS=1
        make O=out vendor/kona-perf_defconfig vendor/xiaomi/munch.config
        make O=out -j$(nproc --all) Image.gz

    - name: 5. 上传 Image.gz
      uses: actions/upload-artifact@v4
      with:
        # 产物名称会根据不同的编译变体自动区分
        name: Munch-Image-${{ matrix.variant }}
        path: out/arch/arm64/boot/Image.gz
